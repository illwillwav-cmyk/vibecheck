<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="VibeCheck">
  <defs>
    <linearGradient id="stone" gradientUnits="userSpaceOnUse" x1="81.9" y1="0" x2="942.1" y2="0">
      <stop offset="0" stop-color="#cdc9bf"/>
      <stop offset="1" stop-color="#8fa6b3"/>
