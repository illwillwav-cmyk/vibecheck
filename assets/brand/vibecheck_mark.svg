    <rect x="604.2" y="408.8" width="76.8" height="332.6" rx="38.4"/>
    <rect x="734.7" y="245.4" width="76.8" height="407.1" rx="38.4"/>
    <rect x="865.3" y="81.9" width="76.8" height="481.7" rx="38.4"/>
  </g>
</svg>
